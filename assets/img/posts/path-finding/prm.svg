<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 400" role="img" aria-label="PRM 动画：在自由空间随机撒点并连成路线图，然后在图上搜出从起点到目标的路径并沿路前进">
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .title{font-size:15px;font-weight:700;fill:#1e293b}
      .sub{font-size:11px;fill:#64748b}
      .lg{font-size:10.5px;fill:#475569}
      .cap{font-size:10.5px;fill:#475569}
      @keyframes dotIn{0%,4%{opacity:0}6%,96%{opacity:1}100%{opacity:0}}
      .dot{animation:dotIn 11s linear infinite;animation-fill-mode:backwards}
      @keyframes edgeIn{0%,24%{opacity:0}32%,96%{opacity:0.6}100%{opacity:0}}
      .edg{animation:edgeIn 11s linear infinite;animation-fill-mode:backwards}
      @keyframes reveal{0%,42%{stroke-dashoffset:628}45%{stroke-dashoffset:550}49%{stroke-dashoffset:436}51%{stroke-dashoffset:376}56%{stroke-dashoffset:236}61%{stroke-dashoffset:76}64%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:628}}
      .pth{animation:reveal 11s linear infinite;stroke-dasharray:628}
      @keyframes walk{
        0%,64%{transform:translate(0px,0px)}
        67%{transform:translate(50px,-60px)}
        71%{transform:translate(140px,10px)}
        74%{transform:translate(200px,0px)}
        79%{transform:translate(340px,10px)}
        85%{transform:translate(340px,-150px)}
        88%,96%{transform:translate(370px,-220px)}
        100%{transform:translate(0px,0px)}
      }
      .probe{animation:walk 11s linear infinite}
      @keyframes msg1{0%,2%{opacity:0}6%,18%{opacity:1}22%,100%{opacity:0}}
      .m1{animation:msg1 11s linear infinite}
      @keyframes msg2{0%,22%{opacity:0}26%,38%{opacity:1}42%,100%{opacity:0}}
      .m2{animation:msg2 11s linear infinite}
      @keyframes msg3{0%,42%{opacity:0}46%,58%{opacity:1}62%,100%{opacity:0}}
      .m3{animation:msg3 11s linear infinite}
    </style>
  </defs>

  <rect x="0" y="0" width="492" height="400" rx="10" fill="#f8fafc"/>
  <text class="t title" x="24" y="27">PRM：随机撒点连成路线图，在图上查路</text>
  <text class="t sub"   x="24" y="46">不用精细建模障碍，采样足够密就能以很高概率找到可行路径</text>

  <!-- messages -->
  <g class="m1">
    <rect x="260" y="58" width="224" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="t" x="372" y="75" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">① 在自由空间随机撒点</text>
  </g>
  <g class="m2">
    <rect x="260" y="58" width="224" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="t" x="372" y="75" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">② 近邻样本连边，形成路线图</text>
  </g>
  <g class="m3">
    <rect x="260" y="58" width="224" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="t" x="372" y="75" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">③ 在路线图上搜索 S → G</text>
  </g>

  <!-- obstacles -->
  <circle cx="200" cy="200" r="55" fill="#475569"/>
  <circle cx="330" cy="240" r="45" fill="#475569"/>
  <text class="t" x="200" y="205" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">障碍</text>
  <text class="t" x="330" y="245" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">障碍</text>

  <!-- roadmap edges -->
  <g class="edg" stroke="#94a3b8" stroke-width="1.5">
    <line x1="60"  y1="320" x2="110" y2="260"/>
    <line x1="110" y1="260" x2="200" y2="330"/>
    <line x1="200" y1="330" x2="260" y2="320"/>
    <line x1="260" y1="320" x2="400" y2="330"/>
    <line x1="400" y1="330" x2="400" y2="170"/>
    <line x1="400" y1="170" x2="430" y2="100"/>
    <line x1="400" y1="170" x2="320" y2="110"/>
    <line x1="320" y1="110" x2="240" y2="70"/>
    <line x1="240" y1="70"  x2="160" y2="80"/>
    <line x1="160" y1="80"  x2="100" y2="140"/>
    <line x1="100" y1="140" x2="110" y2="260"/>
  </g>

  <!-- final path -->
  <polyline class="pth" pathLength="628" points="60,320 110,260 200,330 260,320 400,330 400,170 430,100" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sample dots -->
  <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5">
    <circle class="dot" cx="100" cy="140" r="5" style="animation-delay:0s"/>
    <circle class="dot" cx="110" cy="260" r="5" style="animation-delay:0.2s"/>
    <circle class="dot" cx="160" cy="80"  r="5" style="animation-delay:0.4s"/>
    <circle class="dot" cx="240" cy="70"  r="5" style="animation-delay:0.6s"/>
    <circle class="dot" cx="260" cy="320" r="5" style="animation-delay:0.8s"/>
    <circle class="dot" cx="320" cy="110" r="5" style="animation-delay:1.0s"/>
    <circle class="dot" cx="400" cy="170" r="5" style="animation-delay:1.2s"/>
    <circle class="dot" cx="400" cy="330" r="5" style="animation-delay:1.4s"/>
    <circle class="dot" cx="200" cy="330" r="5" style="animation-delay:1.6s"/>
  </g>

  <!-- start / goal -->
  <circle cx="60"  cy="320" r="13" fill="#16a34a"/>
  <circle cx="430" cy="100" r="13" fill="#dc2626"/>
  <text class="t" x="60"  y="325" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <text class="t" x="430" y="105" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">G</text>

  <!-- probe -->
  <g class="probe">
    <circle cx="60" cy="320" r="11" fill="#2563eb" fill-opacity="0.2"/>
    <circle cx="60" cy="320" r="6"  fill="#1d4ed8"/>
  </g>

  <!-- legend -->
  <rect x="26"  y="340" width="12" height="12" rx="2" fill="#16a34a"/>
  <text class="t lg" x="44"  y="350">起点 S</text>
  <circle cx="102" cy="346" r="6" fill="#dc2626"/>
  <text class="t lg" x="114" y="350">目标 G</text>
  <circle cx="172" cy="346" r="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t lg" x="184" y="350">样本点</text>
  <line x1="240" y1="346" x2="266" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t lg" x="274" y="350">近邻边</text>
  <line x1="326" y1="346" x2="352" y2="346" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <text class="t lg" x="360" y="350">最终路径</text>

  <text class="t cap" x="24" y="382">离线撒点连边建好路线图，之后任意起终点都只需在图上搜索；采样足够密时概率完备。</text>
</svg>
