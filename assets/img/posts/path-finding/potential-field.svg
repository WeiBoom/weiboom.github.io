<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 400" role="img" aria-label="人工势场法动画：目标吸引和障碍排斥叠加成合力场，机器人沿合力方向平滑绕行到达目标">
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#ef4444"/>
    </marker>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .title{font-size:15px;font-weight:700;fill:#1e293b}
      .sub{font-size:11px;fill:#64748b}
      .lg{font-size:10.5px;fill:#475569}
      .cap{font-size:10.5px;fill:#475569}
      @keyframes pulse{0%,100%{opacity:0.15}50%{opacity:0.5}}
      .pl{animation:pulse 3.6s ease-in-out infinite}
      @keyframes walk{
        0%,4%{transform:translate(0px,0px)}
        8%{transform:translate(22px,-3px)}
        12%{transform:translate(41px,-11px)}
        16%{transform:translate(57px,-23px)}
        20%{transform:translate(72px,-37px)}
        24%{transform:translate(87px,-52px)}
        28%{transform:translate(102px,-68px)}
        32%{transform:translate(118px,-82px)}
        36%{transform:translate(137px,-94px)}
        40%{transform:translate(159px,-102px)}
        44%{transform:translate(185px,-105px)}
        48%{transform:translate(211px,-102px)}
        52%{transform:translate(233px,-94px)}
        56%{transform:translate(252px,-82px)}
        60%{transform:translate(268px,-68px)}
        64%{transform:translate(283px,-52px)}
        68%{transform:translate(298px,-37px)}
        72%{transform:translate(313px,-23px)}
        76%{transform:translate(329px,-11px)}
        80%{transform:translate(348px,-3px)}
        84%,96%{transform:translate(370px,0px)}
        100%{transform:translate(0px,0px)}
      }
      .probe{animation:walk 10s linear infinite}
      @keyframes pathIn{0%{opacity:0}10%,100%{opacity:1}}
      .pth{animation:pathIn 10s linear infinite;animation-fill-mode:backwards}
    </style>
  </defs>

  <rect x="0" y="0" width="492" height="400" rx="10" fill="#f8fafc"/>
  <text class="t title" x="24" y="27">人工势场法：目标吸引 + 障碍排斥的合力场</text>
  <text class="t sub"   x="24" y="46">不用搜索，每一步沿合力方向移动，轨迹平滑并自然绕开障碍</text>

  <!-- attractive field arrows -->
  <g stroke="#2563eb" stroke-width="2.5" opacity="0.55" marker-end="url(#ab)">
    <line x1="70"  y1="170" x2="112" y2="185"/>
    <line x1="150" y1="110" x2="194" y2="140"/>
    <line x1="310" y1="110" x2="334" y2="157"/>
    <line x1="390" y1="180" x2="403" y2="217"/>
    <line x1="110" y1="240" x2="155" y2="249"/>
    <line x1="230" y1="240" x2="273" y2="253"/>
  </g>

  <!-- repulsive field arrows -->
  <g stroke="#ef4444" stroke-width="2.5" opacity="0.75" marker-end="url(#ar)">
    <line x1="297" y1="296" x2="315" y2="296"/>
    <line x1="282" y1="333" x2="295" y2="346"/>
    <line x1="245" y1="348" x2="245" y2="366"/>
    <line x1="208" y1="333" x2="196" y2="346"/>
    <line x1="193" y1="296" x2="175" y2="296"/>
    <line x1="208" y1="259" x2="196" y2="247"/>
    <line x1="245" y1="244" x2="245" y2="226"/>
    <line x1="282" y1="259" x2="295" y2="247"/>
    <line x1="182" y1="150" x2="200" y2="150"/>
    <line x1="173" y1="173" x2="185" y2="185"/>
    <line x1="150" y1="182" x2="150" y2="200"/>
    <line x1="127" y1="173" x2="115" y2="185"/>
    <line x1="118" y1="150" x2="100" y2="150"/>
    <line x1="127" y1="127" x2="115" y2="115"/>
    <line x1="150" y1="118" x2="150" y2="100"/>
    <line x1="173" y1="127" x2="185" y2="115"/>
  </g>

  <!-- influence rings -->
  <circle class="pl" cx="245" cy="296" r="70" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" style="animation-delay:0.6s"/>
  <circle class="pl" cx="150" cy="150" r="44" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" style="animation-delay:1.8s"/>
  <circle class="pl" cx="430" cy="300" r="28" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 6" style="animation-delay:0s"/>
  <circle class="pl" cx="430" cy="300" r="18" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 6" style="animation-delay:1.2s"/>

  <!-- obstacles -->
  <circle cx="245" cy="296" r="48" fill="#475569"/>
  <circle cx="150" cy="150" r="26" fill="#475569"/>

  <!-- planned trajectory -->
  <path class="pth" d="M 60 300 C 140 300, 150 195, 245 195 C 340 195, 350 300, 430 300" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>

  <!-- start / goal -->
  <rect x="48" y="288" width="24" height="24" rx="4" fill="#16a34a"/>
  <text class="t" x="60" y="305" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <circle cx="430" cy="300" r="13" fill="#dc2626"/>
  <text class="t" x="430" y="304" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">G</text>

  <!-- probe -->
  <g class="probe">
    <circle cx="60" cy="300" r="11" fill="#2563eb" fill-opacity="0.2"/>
    <circle cx="60" cy="300" r="6"  fill="#1d4ed8"/>
  </g>

  <!-- legend -->
  <rect x="26"  y="340" width="12" height="12" rx="2" fill="#16a34a"/>
  <text class="t lg" x="44"  y="350">起点 S</text>
  <circle cx="102" cy="346" r="6" fill="#dc2626"/>
  <text class="t lg" x="114" y="350">目标 G</text>
  <circle cx="172" cy="346" r="6" fill="#475569"/>
  <text class="t lg" x="184" y="350">障碍</text>
  <circle cx="238" cy="346" r="6" fill="#1d4ed8"/>
  <text class="t lg" x="250" y="350">探针</text>
  <line x1="298" y1="346" x2="322" y2="346" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text class="t lg" x="330" y="350">引力</text>
  <line x1="376" y1="346" x2="400" y2="346" stroke="#ef4444" stroke-width="2.5" marker-end="url(#ar)"/>
  <text class="t lg" x="408" y="350">斥力</text>

  <text class="t cap" x="24" y="384">蓝箭头是目标引力、红箭头是障碍斥力，合力方向引导机器人平滑绕行。</text>
</svg>
