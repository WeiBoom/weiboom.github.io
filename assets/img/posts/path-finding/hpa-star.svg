<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 400" role="img" aria-label="HPA* 动画：先在簇级别粗搜出通道，再在簇内细化成具体路径，探针沿线到达目标">
  <defs>
    <pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse" x="30" y="64">
      <path d="M 36 0 H 0 V 36" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .title{font-size:15px;font-weight:700;fill:#1e293b}
      .sub{font-size:11px;fill:#64748b}
      .lg{font-size:10.5px;fill:#475569}
      .cap{font-size:10.5px;fill:#475569}
      @keyframes coarse{0%,8%{stroke-dashoffset:504}30%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:504}}
      .pc{animation:coarse 10s linear infinite;stroke-dasharray:504}
      @keyframes fine{0%,34%{stroke-dashoffset:396}56%{stroke-dashoffset:360}78%{stroke-dashoffset:36}88%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:396}}
      .pf{animation:fine 10s linear infinite;stroke-dasharray:396}
      @keyframes walk{
        0%,34%{transform:translate(0px,0px)}
        56%{transform:translate(0px,-36px)}
        78%{transform:translate(324px,-36px)}
        88%,96%{transform:translate(324px,0px)}
        100%{transform:translate(0px,0px)}
      }
      .probe{animation:walk 10s linear infinite}
    </style>
  </defs>

  <rect x="0" y="0" width="492" height="400" rx="10" fill="#f8fafc"/>
  <text class="t title" x="24" y="27">HPA*：分层寻路，先在簇级别粗搜，再在簇内细化</text>
  <text class="t sub"   x="24" y="46">把地图切成簇，先粗搜出通道，再细化成具体路径；超大图也能快出解</text>

  <rect x="30" y="64" width="432" height="216" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="30" y="64" width="432" height="216" fill="url(#g)"/>

  <!-- cluster borders -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="102" y1="64" x2="102" y2="280"/>
    <line x1="174" y1="64" x2="174" y2="280"/>
    <line x1="246" y1="64" x2="246" y2="280"/>
    <line x1="318" y1="64" x2="318" y2="280"/>
    <line x1="390" y1="64" x2="390" y2="280"/>
    <line x1="30" y1="136" x2="462" y2="136"/>
    <line x1="30" y1="208" x2="462" y2="208"/>
  </g>

  <!-- coarse path -->
  <polyline class="pc" pathLength="504" points="66,172 138,172 138,100 210,100 282,100 354,100 354,172 426,172" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- wall -->
  <rect x="210" y="172" width="36" height="36" rx="3" fill="#475569"/>
  <rect x="246" y="172" width="36" height="36" rx="3" fill="#475569"/>

  <!-- fine path -->
  <polyline class="pf" pathLength="396" points="84,190 84,154 408,154 408,190" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- start / goal -->
  <rect x="66"  y="172" width="36" height="36" rx="4" fill="#16a34a"/>
  <rect x="390" y="172" width="36" height="36" rx="4" fill="#dc2626"/>
  <text class="t" x="84"  y="197" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <text class="t" x="408" y="197" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">G</text>

  <!-- probe -->
  <g class="probe">
    <circle cx="84" cy="190" r="11" fill="#2563eb" fill-opacity="0.2"/>
    <circle cx="84" cy="190" r="6"  fill="#1d4ed8"/>
  </g>

  <!-- legend -->
  <rect x="26"  y="340" width="12" height="12" rx="2" fill="#16a34a"/>
  <text class="t lg" x="44"  y="350">起点 S</text>
  <rect x="96"  y="340" width="12" height="12" rx="2" fill="#dc2626"/>
  <text class="t lg" x="114" y="350">目标 G</text>
  <circle cx="172" cy="346" r="6" fill="#1d4ed8"/>
  <text class="t lg" x="184" y="350">探针</text>
  <line x1="232" y1="346" x2="260" y2="346" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <text class="t lg" x="268" y="350">簇级粗路径</text>
  <line x1="352" y1="346" x2="380" y2="346" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <text class="t lg" x="388" y="350">簇内细路径</text>

  <text class="t cap" x="24" y="382">先在大格（簇）上粗搜出可行通道，再在簇内细化成具体路径——两级搜索大幅减少扩展量。</text>
</svg>
