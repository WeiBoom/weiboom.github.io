<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 400" role="img" aria-label="ALT 动画：路标到各点的距离给出剩余距离的合法下界，A* 用它剪枝，探针沿最优路径到达目标">
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .title{font-size:15px;font-weight:700;fill:#1e293b}
      .sub{font-size:11px;fill:#64748b}
      .lg{font-size:10.5px;fill:#475569}
      .cap{font-size:10.5px;fill:#475569}
      .e{stroke:#cbd5e1;stroke-width:2.5;fill:none}
      @keyframes rayIn{0%{opacity:0}8%,96%{opacity:0.35}100%{opacity:0}}
      .ray{animation:rayIn 10s linear infinite;animation-fill-mode:backwards}
      @keyframes pop{0%,20%{opacity:0}24%,42%{opacity:0.9}46%,100%{opacity:0}}
      .hl{animation:pop 10s linear infinite}
      @keyframes pr{0%,20%{opacity:0}24%,42%{opacity:0.85}46%,100%{opacity:0}}
      .pr{animation:pr 10s linear infinite}
      @keyframes msg1{0%,2%{opacity:0}6%,18%{opacity:1}22%,100%{opacity:0}}
      .m1{animation:msg1 10s linear infinite}
      @keyframes msg2{0%,20%{opacity:0}24%,42%{opacity:1}46%,100%{opacity:0}}
      .m2{animation:msg2 10s linear infinite}
      @keyframes msg3{0%,48%{opacity:0}52%,70%{opacity:1}74%,100%{opacity:0}}
      .m3{animation:msg3 10s linear infinite}
      @keyframes reveal{0%,74%{stroke-dashoffset:524}78.5%{stroke-dashoffset:394}83%{stroke-dashoffset:278}87.5%{stroke-dashoffset:155}92%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:524}}
      .pth{animation:reveal 10s linear infinite;stroke-dasharray:524}
      @keyframes walk{
        0%,74%{transform:translate(0px,0px)}
        78.5%{transform:translate(80px,-110px)}
        83%{transform:translate(190px,50px)}
        87.5%{transform:translate(290px,-80px)}
        92%,96%{transform:translate(370px,0px)}
        100%{transform:translate(0px,0px)}
      }
      .probe{animation:walk 10s linear infinite}
    </style>
  </defs>

  <rect x="0" y="0" width="492" height="400" rx="10" fill="#f8fafc"/>
  <text class="t title" x="24" y="27">ALT：路标 + 三角不等式，给 A* 更强的下界</text>
  <text class="t sub"   x="24" y="46">预处理算好路标到每个点的距离，查询时用距离之差快速估计剩余路程</text>

  <!-- messages -->
  <g class="m1">
    <rect x="128" y="64" width="234" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="t" x="245" y="81" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">预处理：算好路标 L 到各点的距离</text>
  </g>
  <g class="m2">
    <rect x="128" y="64" width="234" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="t" x="245" y="81" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">|d(L,u) − d(L,G)| ≤ 真实 d(u,G)</text>
  </g>
  <g class="m3">
    <rect x="128" y="64" width="234" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="t" x="245" y="81" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">下界越紧 → A* 扩展越少 → 更快</text>
  </g>

  <!-- formula box -->
  <rect x="298" y="98" width="170" height="48" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="t" x="306" y="117" font-size="11" font-weight="700" fill="#b45309">h(u) = |d(L,u) − d(L,G)|</text>
  <text class="t" x="306" y="135" font-size="10.5" fill="#b45309">≤ d(u,G)：安全下界</text>

  <!-- distance rays -->
  <g stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4">
    <line class="ray" x1="240" y1="110" x2="60"  y2="300" style="animation-delay:0.2s"/>
    <line class="ray" x1="240" y1="110" x2="140" y2="190" style="animation-delay:0.5s"/>
    <line class="ray" x1="240" y1="110" x2="250" y2="240" style="animation-delay:0.8s"/>
    <line class="ray" x1="240" y1="110" x2="350" y2="160" style="animation-delay:1.1s"/>
    <line class="ray" x1="240" y1="110" x2="430" y2="300" style="animation-delay:1.4s"/>
  </g>

  <!-- edges -->
  <g class="e">
    <line x1="60"  y1="300" x2="140" y2="190"/>
    <line x1="140" y1="190" x2="250" y2="240"/>
    <line x1="250" y1="240" x2="350" y2="160"/>
    <line x1="350" y1="160" x2="430" y2="300"/>
    <line x1="140" y1="190" x2="350" y2="160"/>
    <line x1="240" y1="110" x2="140" y2="190"/>
    <line x1="240" y1="110" x2="350" y2="160"/>
  </g>

  <!-- highlighted lower bound rays -->
  <g class="hl" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 4">
    <line x1="240" y1="110" x2="250" y2="240"/>
    <line x1="240" y1="110" x2="430" y2="300"/>
  </g>
  <text class="t hl" x="256" y="172" font-size="10" font-weight="700" fill="#1d4ed8">d(L,B)</text>
  <text class="t hl" x="358" y="220" font-size="10" font-weight="700" fill="#1d4ed8">d(L,G)</text>

  <!-- actual distance highlight -->
  <g class="hl" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round">
    <line x1="250" y1="240" x2="350" y2="160"/>
    <line x1="350" y1="160" x2="430" y2="300"/>
  </g>
  <text class="t hl" x="296" y="186" font-size="10" font-weight="700" fill="#b45309">真实 d(B,G)</text>

  <!-- pulse rings -->
  <circle class="pr" cx="250" cy="240" r="22" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle class="pr" cx="430" cy="300" r="22" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- final path -->
  <polyline class="pth" pathLength="524" points="60,300 140,190 250,240 350,160 430,300" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- landmark -->
  <polygon points="240,94 243.8,104.8 255.2,105.1 246.1,112 249.4,123 240,116.4 230.6,123 233.9,112 224.8,105.1 236.2,104.8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="240" y="142" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">路标 L</text>

  <!-- nodes -->
  <circle cx="140" cy="190" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="140" y="195" font-size="12" fill="#1e293b" text-anchor="middle">A</text>
  <circle cx="250" cy="240" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="250" y="245" font-size="12" fill="#1e293b" text-anchor="middle">B</text>
  <circle cx="350" cy="160" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="350" y="165" font-size="12" fill="#1e293b" text-anchor="middle">C</text>
  <circle cx="60"  cy="300" r="14" fill="#16a34a"/>
  <circle cx="430" cy="300" r="14" fill="#dc2626"/>
  <text class="t" x="60"  y="305" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <text class="t" x="430" y="305" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">G</text>

  <!-- probe -->
  <g class="probe">
    <circle cx="60" cy="300" r="11" fill="#2563eb" fill-opacity="0.2"/>
    <circle cx="60" cy="300" r="6"  fill="#1d4ed8"/>
  </g>

  <!-- legend -->
  <rect x="26"  y="340" width="12" height="12" rx="2" fill="#16a34a"/>
  <text class="t lg" x="44"  y="350">起点 S</text>
  <rect x="96"  y="340" width="12" height="12" rx="2" fill="#dc2626"/>
  <text class="t lg" x="114" y="350">目标 G</text>
  <polygon points="166,334 168.2,340.5 175,340.7 169.5,344.9 171.5,351.5 166,347.5 160.5,351.5 162.5,344.9 157,340.7 163.8,340.5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <text class="t lg" x="180" y="350">路标 L</text>
  <line x1="238" y1="346" x2="264" y2="346" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 4"/>
  <text class="t lg" x="272" y="350">距离下界</text>
  <line x1="352" y1="346" x2="378" y2="346" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <text class="t lg" x="386" y="350">真实距离</text>

  <text class="t cap" x="24" y="382">路标距离之差是到目标的合法下界，下界越紧，A* 需要扩展的节点就越少。</text>
</svg>
